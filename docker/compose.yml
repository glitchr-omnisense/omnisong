# omnisense/omnisong with every catalogue package, against the real services:
#
#   cp .env.dist .env                                        # an Odesli key if you have one; iTunes needs none
#   docker compose run --rm omnisong catalogs                # which catalogues are installed and configured
#   docker compose run --rm omnisong links 028948637751 --label Label Exemple --label-url https://label.example.org
#   docker compose run --rm omnisong release 028948637751   # the merged release: tracks, previews, links
#   docker compose run --rm omnisong releases "Carlos Kleiber" --limit 10
#   docker compose run --rm omnisong embed https://music.apple.com/de/album/beethoven-symphonies-nos-5-7/1644892939 --dark
#   docker compose run --rm omnisong bare                    # plain PHP: no bundle, no container, and what PHP loaded
#   docker compose run --rm omnisong test                    # every package's tests
#
# Catalogues come from GitHub (branch 1.x) unless their checkout sits under
# OMNISONG_PLUGINS (set it to ../.. in .env when this core sits in the
# workspace beside them): then that checkout is what runs. omnisense/contracts
# likewise: its checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts
# in .env when it sits beside the family's folder), its tests run with the
# family's; GitHub otherwise.
#
#   docker compose run --rm omnisong phpstan                 # PHPStan, each package at the highest level
name: omnisong-harness

services:
  omnisong:
    build: .
    image: omnisense/omnisong-harness
    # The image may be another family's harness tagged (PHP 8.4 with intl and Composer): the
    # entrypoint is named here, not taken from the image.
    entrypoint: ["/omnisong/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnisong/core
      - ${OMNISONG_PLUGINS:-./plugins}:/omnisong/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

volumes:
  harness:
